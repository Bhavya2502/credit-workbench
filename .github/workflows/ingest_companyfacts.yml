name: ingest-companyfacts
# Tracker item C1. Nightly full refresh of SEC companyfacts into the R2 raw zone
# (02:30 UTC ~ 08:00 IST); delta-optimization via the submissions API comes with
# the staging build (C4). Manual trigger kept for reruns.
# Nightly refresh is OFF. This file has no downstream consumer: every mart is built
# from the Financial Statement and Notes archives instead, so refreshing it nightly
# spent about 150 runner minutes a month producing data nothing reads. Re-enable the
# schedule when the incremental pipeline that needs its freshness actually exists.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: uv sync
      - name: Download SEC companyfacts.zip and upload to R2
        run: uv run python -m credit_workbench.ingest.sec_companyfacts
