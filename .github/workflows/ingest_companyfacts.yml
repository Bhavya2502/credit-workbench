name: ingest-companyfacts
# Tracker item C1. Manual trigger until R2 secrets are configured (tracker A2/A5);
# switches to nightly cron once the first manual run succeeds.
on:
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: uv sync
      - name: Download SEC companyfacts.zip and upload to R2
        run: uv run python -m credit_workbench.ingest.sec_companyfacts
