name: warehouse-build-views
# Rebuilds MotherDuck views over the R2 lake and refreshes materialised tables.
# Run after any ingest.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.warehouse.build_views
      - name: Regenerate data dictionary (A7)
        run: uv run python -m credit_workbench.warehouse.data_dictionary
      - name: Commit dictionary if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_dictionary.md
          git diff --staged --quiet || git commit -m "Regenerate data dictionary [skip ci]"
          git push
