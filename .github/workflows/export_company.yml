name: export-company
# Export everything held for a few companies as CSV, published as a run artifact.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers, e.g. PFE,CAT,WMT"
        required: true
        default: PFE,CAT,WMT
        type: string

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.warehouse.export_company --tickers ${{ inputs.tickers }}
      - uses: actions/upload-artifact@v4
        with:
          name: company-export
          path: export/
          retention-days: 7
