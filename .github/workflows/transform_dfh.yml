name: transform-dfh
# Tracker D1 (note inputs), F1/F2 (segments, concentration), H1/H3 (event feed).
# The three are independent, so they run side by side.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "all | note_inputs | segments | events"
        required: true
        default: all
        type: choice
        options: [all, note_inputs, segments, events]

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  note_inputs:
    if: inputs.parts == 'all' || inputs.parts == 'note_inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.note_inputs

  events:
    if: inputs.parts == 'all' || inputs.parts == 'events'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.events

  segments:
    if: inputs.parts == 'all' || inputs.parts == 'segments'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        archives: ["2009-2012", "2013-2015", "2016-2018",
                   "2019-2021", "2022-2023", "2024-2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.segments --archives ${{ matrix.archives }}

  segments_register:
    if: always() && needs.segments.result == 'success'
    needs: segments
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.segments --register
