name: export-industry-year
# Industry x country x year revenue, EBITDA and margin, published as a run artifact.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.warehouse.export_industry_year
      - uses: actions/upload-artifact@v4
        with:
          name: credit-workbench-industry-year
          path: export/
          retention-days: 14
