name: transform-spreads
# Tracker C4 -> C5 -> C6.
#
# C4 runs in two stages, each batched on the grain that keeps related rows together:
#   dedup    split by *source archive* (the lake's own partitioning) so each archive
#            is read exactly once
#   vintage  split by *period year* — every copy of a figure describes the same
#            period, so a period partition holds all copies of its figures and none
#            of anyone else's, which is what makes the pass affordable
# Getting either grain wrong is not just slow: batching vintages by filing year would
# split copies of the same figure apart and silently corrupt the first/latest flags.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all | facts_pit (dedup+vintage) | vintage | spreads"
        required: true
        default: all
        type: choice
        options: [all, facts_pit, vintage, spreads]
      skip_tag_statement:
        description: "Skip rebuilding the tag->statement lookup (already built)"
        type: boolean
        default: false

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  tag_statement:
    if: (inputs.stage == 'all' || inputs.stage == 'facts_pit') && !inputs.skip_tag_statement
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.tag_statement

  dedup:
    if: always() && (inputs.stage == 'all' || inputs.stage == 'facts_pit')
                 && (needs.tag_statement.result == 'success'
                     || needs.tag_statement.result == 'skipped')
    needs: tag_statement
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        archives: ["2009-2012", "2013-2015", "2016-2018",
                   "2019-2021", "2022-2023", "2024-2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.facts_pit --archives ${{ matrix.archives }}

  wipe_pit:
    if: always() && contains(fromJson('["all","facts_pit","vintage"]'), inputs.stage)
                 && (needs.dedup.result == 'success' || needs.dedup.result == 'skipped')
    needs: dedup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.register --action wipe

  vintage:
    if: always() && contains(fromJson('["all","facts_pit","vintage"]'), inputs.stage)
                 && needs.wipe_pit.result == 'success'
    needs: wipe_pit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        years: ["2005-2010", "2011-2013", "2014-2016", "2017-2019",
                "2020-2022", "2023-2024", "2025-2028"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.vintage --years ${{ matrix.years }}

  register:
    if: always() && contains(fromJson('["all","facts_pit","vintage"]'), inputs.stage)
                 && needs.vintage.result == 'success'
    needs: vintage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.register --action register

  wipe_lines:
    if: always() && (inputs.stage == 'all' || inputs.stage == 'spreads')
                 && (needs.register.result == 'success'
                     || needs.register.result == 'skipped')
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.register --action wipe_lines

  spread_lines:
    if: always() && needs.wipe_lines.result == 'success'
    needs: wipe_lines
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        years: ["2005-2010", "2011-2013", "2014-2016", "2017-2019",
                "2020-2022", "2023-2024", "2025-2028"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.spreads --part lines --years ${{ matrix.years }}

  spread_marts:
    if: always() && needs.spread_lines.result == 'success'
    needs: spread_lines
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: C6 - wide marts, checks, coverage
        run: uv run python -m credit_workbench.transform.spreads --part marts
      - name: Verify
        run: uv run python -m credit_workbench.transform.verify_spreads
