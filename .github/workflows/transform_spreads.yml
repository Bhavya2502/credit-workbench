name: transform-spreads
# Tracker C4 -> C5 -> C6.
#
# C4 runs in two stages. Stage 1 de-duplicates, split by *source archive* so each
# archive is read exactly once. Stage 2 computes reporting vintages, which must see
# every copy of a figure together and so runs as a single pass over the (much smaller)
# de-duplicated output.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all, facts_pit (C4), or spreads (C5+C6)"
        required: true
        default: all
        type: choice
        options: [all, facts_pit, spreads]
      skip_tag_statement:
        description: "Skip rebuilding the tag->statement lookup (already built)"
        type: boolean
        default: false

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  tag_statement:
    if: (inputs.stage == 'all' || inputs.stage == 'facts_pit') && !inputs.skip_tag_statement
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.tag_statement

  dedup:
    if: always() && (inputs.stage == 'all' || inputs.stage == 'facts_pit')
                 && (needs.tag_statement.result == 'success' || inputs.skip_tag_statement)
    needs: tag_statement
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        archives: ["2009-2012", "2013-2015", "2016-2018",
                   "2019-2021", "2022-2023", "2024-2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.facts_pit --archives ${{ matrix.archives }}

  vintage:
    if: always() && (inputs.stage == 'all' || inputs.stage == 'facts_pit')
                 && needs.dedup.result == 'success'
    needs: dedup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.vintage

  spreads:
    if: always() && (inputs.stage == 'all' || inputs.stage == 'spreads')
                 && (needs.vintage.result == 'success' || inputs.stage == 'spreads')
    needs: vintage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: C5 + C6 - map and spread marts
        run: uv run python -m credit_workbench.transform.spreads
      - name: Verify
        run: uv run python -m credit_workbench.transform.verify_spreads
