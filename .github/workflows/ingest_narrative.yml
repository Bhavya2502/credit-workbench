name: ingest-narrative
# G1: 10-K narrative sections, and the exhibits that carry covenant terms.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "sections_dry | sections | exhibits_dry | exhibits | backfill | register"
        required: true
        default: sections_dry
        type: choice
        options: [sections_dry, sections, exhibits_dry, exhibits, backfill, register]
      years:
        description: "filing years for sections, e.g. 2009-2013"
        required: true
        default: "2019-2026"
        type: string
      exhibit_years:
        description: "filing years for exhibits (backfill mode)"
        required: false
        default: "2009-2018"
        type: string

# SEC's fair-access limit is ten requests a second for the whole requester, not per job.
# Each fetching job already paces itself just under that, so two running at once would
# breach it. Queueing whole runs keeps the pace right however many are dispatched.
concurrency:
  group: sec-edgar-fetch
  cancel-in-progress: false

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  sections_dry:
    # Validate the splitter on real documents before committing hours of fetching.
    if: inputs.parts == 'sections_dry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_sections --years ${{ inputs.years }} --limit 60 --dry-run

  sections:
    # One job fetching asynchronously at just under SEC's ten-per-second limit. Cheaper
    # in runner minutes than parallel jobs that each have to throttle themselves down.
    if: inputs.parts == 'sections'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_sections --years ${{ inputs.years }}

  exhibits_dry:
    if: inputs.parts == 'exhibits_dry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_exhibits --years ${{ inputs.years }} --limit 40 --dry-run

  exhibits:
    if: inputs.parts == 'exhibits'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_exhibits --years ${{ inputs.years }}

  # The two remaining backfills, chained rather than dispatched separately so the
  # second cannot start fetching while the first still is.
  backfill_sections:
    if: inputs.parts == 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_sections --years ${{ inputs.years }}

  backfill_exhibits:
    if: inputs.parts == 'backfill'
    needs: [backfill_sections]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.filing_exhibits --years ${{ inputs.exhibit_years }}

  backfill_register:
    if: always() && inputs.parts == 'backfill' && needs.backfill_exhibits.result == 'success'
    needs: [backfill_sections, backfill_exhibits]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.narrative_register
      - name: Verify
        run: uv run python -m credit_workbench.transform.verify_narrative

  register:
    if: inputs.parts == 'register'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.ingest.narrative_register
      - name: Verify
        run: uv run python -m credit_workbench.transform.verify_narrative
