name: transform-note-index
# Every fact under the note the filer presented it in.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "all | build | register"
        required: true
        default: all
        type: choice
        options: [all, build, register]

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  build:
    if: inputs.parts == 'all' || inputs.parts == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        archives: ["2009-2012", "2013-2015", "2016-2018", "2019-2020",
                   "2021-2022", "2023-2023", "2024-2024", "2025-2026"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.note_index --archives ${{ matrix.archives }}

  register:
    if: always() && (needs.build.result == 'success' || inputs.parts == 'register')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m credit_workbench.transform.note_index --register
      - name: Verify
        run: uv run python -m credit_workbench.transform.verify_note_index
