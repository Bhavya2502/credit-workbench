[project]
name = "credit-workbench"
version = "0.1.0"
description = "Corporate credit analysis data platform - cloud-only pipeline (SEC XBRL -> R2 -> MotherDuck)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "xlsxwriter>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_workbench"]
